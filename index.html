<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Flashcards</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- Estrutura do Flashcard -->
        <div class="flashcard">
            <div class="flashcard-inner">
                <!-- Frente do cartão -->
                <div class="flashcard-front">
                    <h2>Frente</h2>
                    <p>Passe o mouse ou clique para ver a resposta!</p>
                </div>
                <!-- Verso do cartão -->
                <div class="flashcard-back">
                    <h2>Verso</h2>
                    <p>Aqui está a resposta do seu Flashcard.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
